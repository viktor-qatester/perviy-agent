name: Daily IT digest

on:
  schedule:
    # 05:00 Europe/Minsk (UTC+3) = 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent and send email
        env:
          NOTIFY_VIA: email
          DRY_RUN: "false"
          DIGEST_DAYS_AHEAD: "7"
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USE_TLS: "true"
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python src/main.py --send
