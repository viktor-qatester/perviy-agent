name: IT digest

# Отчёт мониторинга — только Telegram (TELEGRAM_CHAT_ID).
# Нужны GitHub Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID

on:
  schedule:
    # 05:00 Europe/Minsk (UTC+3) = 02:00 UTC, Monday and Friday
    - cron: "0 2 * * 1,5"
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect and send Telegram report
        env:
          NOTIFY_VIA: telegram
          DRY_RUN: "false"
          DIGEST_DAYS_AHEAD: "7"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/main.py --send
